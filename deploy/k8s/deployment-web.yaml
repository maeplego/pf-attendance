apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: attendance-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attendance-web
  template:
    metadata:
      labels:
        app: attendance-web
    spec:
      containers:
        - name: web
          image: pf-attendance-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3019
              name: http
          env:
            - name: PORT
              value: "3019"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXT_PUBLIC_ATTENDANCE_API_URL
              value: http://attendance-api.localhost
          readinessProbe:
            httpGet:
              path: /
              port: 3019
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3019
            initialDelaySeconds: 25
            periodSeconds: 10
